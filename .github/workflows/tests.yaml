name: tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tytanic
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: tytanic@0.4.1

      - name: Install typst-package-check
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: typst-package-check
          git: https://github.com/typst/package-check
          tag: v0.7.0

      - name: Install tinymist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/Myriad-Dreamin/tinymist/releases/download/v0.15.12/tinymist-installer.sh | sh

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.59.0'

      - name: Run tests (tytanic)
        run: tt run

      - name: Run tests (tinymist)
        run: tinymist test lib.typ

      - name: Run package-check
        run: |
          make -C src/diagraph-layout module
          just _package
          cd autograph && typst-package-check check

