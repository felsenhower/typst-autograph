name: tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.59.0'

      - name: Install typst-package-check
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: package-check
          git: https://github.com/typst/package-check
          tag: v0.7.0

      - name: Run package-check
        run: |
          just package
          cd autograph
          typst-package-check check
